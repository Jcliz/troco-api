name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: troco
          POSTGRES_PASSWORD: troco
          POSTGRES_DB: troco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U troco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://troco:troco@localhost:5432/troco_test
      DIRECT_URL: postgresql://troco:troco@localhost:5432/troco_test
      APP_URL: http://localhost:3000
      MAIL_DRIVER: log
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Detect project
        id: project
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (before task API-01): skipping build steps."; fi

      - uses: pnpm/action-setup@v4
        if: steps.project.outputs.exists == 'true'

      - uses: actions/setup-node@v4
        if: steps.project.outputs.exists == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.project.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.project.outputs.exists == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.project.outputs.exists == 'true'
        run: pnpm typecheck

      - name: Unit tests
        if: steps.project.outputs.exists == 'true'
        run: pnpm test

      - name: Migrations
        if: steps.project.outputs.exists == 'true' && hashFiles('prisma/schema.prisma') != ''
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

      - name: Integration tests
        if: steps.project.outputs.exists == 'true'
        run: pnpm test:integration

      - name: OpenAPI up to date
        if: steps.project.outputs.exists == 'true' && hashFiles('openapi.json') != ''
        run: pnpm openapi:check

      - name: Build
        if: steps.project.outputs.exists == 'true'
        run: pnpm build
